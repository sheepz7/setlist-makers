<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SETLIST MAKER</title>
<style>
:root{--bg:#f5f3ef;--ink:#171717;--muted:#777;--line:#d9d5ce;--card:#fff;--accent:#111}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Kaku Gothic ProN",Arial,sans-serif}
.wrap{max-width:760px;margin:auto;padding:24px 18px 70px}.hero{padding:42px 4px 28px;text-align:center}
.kicker{font-size:11px;letter-spacing:.25em;color:#777}.hero h1{font-size:38px;letter-spacing:.08em;margin:10px 0 8px}.hero p{margin:0;color:#777;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;margin:14px 0;box-shadow:0 6px 24px #00000008}
h2{font-size:16px;margin:0 0 15px}.label{font-size:12px;color:#666;margin:16px 0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap}.choice{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;cursor:pointer;font-size:13px}.choice.active{background:#111;color:#fff;border-color:#111}
input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 13px;font-size:14px;outline:none}input:focus{border-color:#888}
.addrow{display:flex;gap:8px}.addrow input{flex:1}.btn{border:0;border-radius:12px;padding:12px 16px;background:#111;color:#fff;font-weight:700;cursor:pointer}.btn.secondary{background:#eee;color:#222}
.songlist{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.song{background:#f0eee9;border-radius:999px;padding:7px 10px;font-size:12px;cursor:pointer}.song small{color:#888;margin-left:4px}.song:hover{background:#e4e1da}
.generate{width:100%;font-size:16px;padding:15px;margin-top:5px}
.result{display:none}.resulthead{text-align:center;padding:12px 0 20px}.resulthead h2{font-size:28px;letter-spacing:.08em;margin:5px}.meta{color:#777;font-size:12px}.setlist{background:#111;color:#fff;border-radius:20px;padding:22px 20px}
.setrow{display:flex;gap:16px;padding:12px 0;border-bottom:1px solid #333;align-items:baseline}.num{font-size:12px;color:#999;width:26px}.title{font-size:15px}.mc{text-align:center;padding:14px;color:#aaa;font-size:10px;letter-spacing:.25em}.encore{margin-top:20px;border-top:1px solid #444;padding-top:16px}.encore h3{font-size:11px;letter-spacing:.25em;color:#aaa;margin:0 0 7px}.actions{display:flex;gap:8px;margin-top:14px}.actions .btn{flex:1}
.note{font-size:11px;color:#888;line-height:1.7}.empty{color:#999;font-size:12px;padding:8px 0}
@media(max-width:520px){.hero h1{font-size:31px}.card{padding:18px}.setlist{padding:18px 15px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="kicker">FAN-MADE · SETLIST GENERATOR</div>
    <h1>SETLIST MAKER</h1>
    <p>あなたの理想のライブセトリを、つくろう。</p>
  </header>

  <section class="card">
    <h2>01　公演を設定</h2>
    <div class="label">アーティスト</div>
    <input id="artist" value="Hey! Sɑy! JUMP" placeholder="アーティスト名">
    <div class="label">曲数</div>
    <div class="row" id="countChoices">
      <button class="choice" data-count="15">15曲</button>
      <button class="choice active" data-count="20">20曲</button>
      <button class="choice" data-count="25">25曲</button>
      <button class="choice" data-count="30">30曲</button>
    </div>
    <div class="label">セトリの雰囲気</div>
    <div class="row" id="moodChoices">
      <button class="choice active" data-mood="balanced">王道</button>
      <button class="choice" data-mood="up">盛り上がり</button>
      <button class="choice" data-mood="emo">エモ</button>
      <button class="choice" data-mood="dance">ダンス</button>
      <button class="choice" data-mood="random">完全ランダム</button>
    </div>
  </section>

  <section class="card">
    <h2>02　曲を登録</h2>
    <div class="addrow">
      <input id="songInput" placeholder="曲名を入力して追加">
      <button class="btn" id="addBtn">追加</button>
    </div>
    <div class="songlist" id="songList"></div>
    <p class="note">曲名をタップすると削除できます。最初からサンプル曲が入っています。好きなアーティストの曲に入れ替えて遊べます。</p>
  </section>

  <section class="card">
    <h2>03　こだわり</h2>
    <div class="label">絶対入れたい曲</div>
    <div class="addrow"><input id="mustInput" placeholder="例：ウィークエンダー"><button class="btn secondary" id="mustAdd">追加</button></div>
    <div class="songlist" id="mustList"></div>
    <div class="label">入れたくない曲</div>
    <div class="addrow"><input id="avoidInput" placeholder="例：○○○"><button class="btn secondary" id="avoidAdd">追加</button></div>
    <div class="songlist" id="avoidList"></div>
  </section>

  <button class="btn generate" id="generate">✨ セトリを作る</button>

  <section class="result" id="result">
    <div class="resulthead">
      <div class="kicker">YOUR LIVE</div>
      <h2 id="resultArtist"></h2>
      <div class="meta" id="resultMeta"></div>
    </div>
    <div class="setlist" id="setlist"></div>
    <div class="actions">
      <button class="btn" id="again">🔄 もう一度</button>
      <button class="btn secondary" id="save">📸 画像保存</button>
    </div>
  </section>
</div>

<script>
const sample = [
["ウィークエンダー","up"],["Come On A My House","up"],["Ride With Me","dance"],
["AinoArika","dance"],["SUPER DELICATE","emo"],["Fantastic Time","dance"],
["Give Me Love","emo"],["OVER THE TOP","up"],["White Love","emo"],
["マエヲムケ","up"],["ファンファーレ！","up"],["Last Mermaid…","emo"],
["I am","dance"],["Muah Muah","up"],["Your Song","emo"],["狼青年","dance"],
["ネガティブファイター","up"],["群青ランナウェイ","dance"],["Sing-along","up"],
["春玄鳥","emo"],["DEAR MY LOVER","up"],["それぞれ。","emo"],
["Ready to Jump","dance"],["ウラオモテ","dance"],["恋をするんだ","emo"],
["キミアトラクション","up"],["明日へのYELL","up"],["Chau#","up"],
["切なさ、ひきかえに","emo"],["Your Seed","up"],["Ultra Music Power","up"]
];
let songs = [...sample];
let must = [], avoid = [], count=20, mood="balanced";

function renderSongs(){
  const el=document.getElementById("songList"); el.innerHTML="";
  songs.forEach((s,i)=>{const b=document.createElement("span");b.className="song";b.textContent=s[0]+" ×";b.onclick=()=>{songs.splice(i,1);renderSongs()};el.appendChild(b)});
}
function renderTags(arr,id){
  const el=document.getElementById(id);el.innerHTML="";
  arr.forEach((s,i)=>{const b=document.createElement("span");b.className="song";b.textContent=s+" ×";b.onclick=()=>{arr.splice(i,1);renderTags(arr,id)};el.appendChild(b)});
}
renderSongs();

document.querySelectorAll("#countChoices .choice").forEach(b=>b.onclick=()=>{count=+b.dataset.count;document.querySelectorAll("#countChoices .choice").forEach(x=>x.classList.remove("active"));b.classList.add("active")});
document.querySelectorAll("#moodChoices .choice").forEach(b=>b.onclick=()=>{mood=b.dataset.mood;document.querySelectorAll("#moodChoices .choice").forEach(x=>x.classList.remove("active"));b.classList.add("active")});

function addSong(){
 const v=document.getElementById("songInput").value.trim(); if(!v)return;
 songs.push([v,"up"]);document.getElementById("songInput").value="";renderSongs();
}
document.getElementById("addBtn").onclick=addSong;
document.getElementById("songInput").onkeydown=e=>{if(e.key==="Enter")addSong()};

function addTag(input,arr,id){const el=document.getElementById(input),v=el.value.trim();if(v){arr.push(v);el.value="";renderTags(arr,id)}}
document.getElementById("mustAdd").onclick=()=>addTag("mustInput",must,"mustList");
document.getElementById("avoidAdd").onclick=()=>addTag("avoidInput",avoid,"avoidList");

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function generate(){
 let pool=songs.filter(s=>!avoid.includes(s[0]));
 if(pool.length<count){alert("曲数より登録曲が少ないよ！曲を追加してね。");return}
 let forced=must.map(n=>pool.find(s=>s[0]===n)).filter(Boolean);
 forced=[...new Map(forced.map(x=>[x[0],x])).values()].slice(0,count);
 let rest=pool.filter(s=>!forced.some(x=>x[0]===s[0]));
 if(mood==="random") rest=shuffle(rest);
 else {
   const weight=s=>mood==="up"?(s[1]==="up"?4:s[1]==="dance"?3:1):
     mood==="dance"?(s[1]==="dance"?4:s[1]==="up"?2:1):
     mood==="emo"?(s[1]==="emo"?4:s[1]==="up"?2:1):
     (s[1]==="up"?3:s[1]==="dance"?2:2);
   rest=shuffle(rest).sort((a,b)=>weight(b)-weight(a)+Math.random()-.5);
 }
 let chosen=[...forced,...rest].slice(0,count);
 chosen=shuffle(chosen);
 // ライブらしい流れ：最初はアップ、終盤はエモ/アップ、アンコールはアップ寄り
 if(mood!=="random"){
   const first=chosen.findIndex(x=>x[1]==="up"||x[1]==="dance"); if(first>0)[chosen[0],chosen[first]]=[chosen[first],chosen[0]];
 }
 const encoreCount=count>=25?3:2;
 const encore=chosen.splice(chosen.length-encoreCount,encoreCount);
 const artist=document.getElementById("artist").value.trim()||"MY LIVE";
 document.getElementById("resultArtist").textContent=artist;
 document.getElementById("resultMeta").textContent=`${count} SONGS · ${mood==="balanced"?"王道":mood==="up"?"盛り上がり":mood==="emo"?"エモ":mood==="dance"?"ダンス":"ランダム"}`;
 const box=document.getElementById("setlist");box.innerHTML="";
 chosen.forEach((s,i)=>{
   const d=document.createElement("div");d.className="setrow";
   d.innerHTML=`<span class="num">${String(i+1).padStart(2,"0")}</span><span class="title">${s[0]}</span>`;
   box.appendChild(d);
   if(i===Math.floor(chosen.length*.48)-1){const mc=document.createElement("div");mc.className="mc";mc.textContent="— MC —";box.appendChild(mc)}
 });
 const en=document.createElement("div");en.className="encore";en.innerHTML="<h3>ENCORE</h3>";
 encore.forEach((s,i)=>{const d=document.createElement("div");d.className="setrow";d.innerHTML=`<span class="num">${String(chosen.length+i+1).padStart(2,"0")}</span><span class="title">${s[0]}</span>`;en.appendChild(d)});
 box.appendChild(en);
 document.getElementById("result").style.display="block";document.getElementById("result").scrollIntoView({behavior:"smooth"});
}
document.getElementById("generate").onclick=generate;
document.getElementById("again").onclick=generate;
document.getElementById("save").onclick=async()=>{
 const node=document.getElementById("setlist");
 const blob=new Blob([`<!doctype html><html><body style="background:#111;color:#fff;font-family:sans-serif;padding:30px">${node.outerHTML}</body></html>`],{type:"text/html"});
 // Portable fallback: save the result as an HTML card if canvas libraries are unavailable.
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="my-setlist.html";a.click();URL.revokeObjectURL(a.href);
 alert("セトリカードをHTMLとして保存しました。");
};
</script>
</body>
</html>
